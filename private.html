<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private blessings</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1e7d9;color:#51433d;font-family:Georgia,serif;padding:28px 16px}.wrap{max-width:720px;margin:auto}h1{font-weight:400;text-align:center;color:#98704e}.sub{text-align:center;color:#87776a}article{background:#fffaf3;border:1px solid #d2b995;padding:16px;margin:12px 0;border-radius:4px}article h3{margin:0 0 7px;font-weight:600}time{font:11px Arial;color:#9b8979}p{line-height:1.5;white-space:pre-wrap}.empty{text-align:center;padding:40px;color:#87776a}</style></head><body><main class="wrap"><h1>Priya &amp; Souvik</h1><div class="sub">A private collection of your guests’ blessings</div><div id="messages"><p class="empty">Loading blessings…</p></div></main><script>
fetch('/api/private/blessings').then(r=>{if(!r.ok)throw Error('Please sign in with your couple password.');return r.json()}).then(rows=>{const root=document.getElementById('messages');root.replaceChildren();if(!rows.length){root.innerHTML='<p class="empty">No blessings yet. Your first wishes will appear here.</p>';return}rows.forEach(x=>{const a=document.createElement('article'),h=document.createElement('h3'),p=document.createElement('p'),t=document.createElement('time');h.textContent=x.name;p.textContent=x.message;t.textContent=new Date(x.created_at+'Z').toLocaleString();a.append(h,p,t);root.append(a)})}).catch(e=>{document.getElementById('messages').innerHTML='<p class="empty">Could not load messages. '+e.message+'</p>'});
</script></body></html>
